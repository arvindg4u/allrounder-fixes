<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vplink — please wait 20 seconds to get your link</title>
<style>
 :root{color-scheme:dark}
 body{margin:0;background:#0e1116;color:#c9d1d9;font:16px/1.7 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 .wrap{max-width:720px;margin:0 auto;padding:24px;text-align:center}
 .btn{display:inline-block;font-weight:700;padding:13px 26px;border-radius:9px;border:0;cursor:pointer;font-size:16px;background:#238636;color:#fff;text-decoration:none}
 #wpsafe-wait{color:#58a6ff;font-size:34px;font-weight:800}
 .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Back on the shortener — final step</h1>
  <p>Please wait <span id="wpsafe-wait">20</span> seconds, the link is being generated…</p>

  <!-- the destination is already here, base64'd, exactly like wpsafelink does it -->
  <form id="wpsafelink-landing">
    <input type="hidden" name="newwpsafelink" value="">
  </form>

  <div id="wpsafe-generate"><button id="wpsafegenerate" class="btn">Get Link</button></div>
  <div id="wpsafe-link" class="hide"><a class="btn" href="#">Click here to continue</a></div>
</div>
<script>
(function () {
  var dest = 'https://www.mediafire.com/file/abc123/movie.mkv/file';
  document.querySelector('input[name=newwpsafelink]').value = btoa(JSON.stringify({ linkr: dest }));

  var left = 20;
  var iv = setInterval(function () {
    left--;
    document.getElementById('wpsafe-wait').textContent = Math.max(0, left);
    if (left <= 0) { clearInterval(iv); }
  }, 1000);

  document.getElementById('wpsafegenerate').addEventListener('click', function () {
    if (left > 0) { window.__tooEarly = true; return; }      // real sites 400 here
    document.getElementById('wpsafe-link').classList.remove('hide');
  });
})();
</script>
<script>
if (new URLSearchParams(location.search).get('auto') === '1') {
  var s = document.createElement('script'); s.src = '../shortlink-autoskip.user.js'; document.body.appendChild(s);
}
</script>
</body>
</html>
