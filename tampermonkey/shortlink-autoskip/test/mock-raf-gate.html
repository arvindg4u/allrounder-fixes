<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Get Link</title>
</head>

<body>
    <!-- requestAnimationFrame-driven countdown that reads performance.now()
         for its baseline. The rAF patch must hand the page timestamps from the
         SAME (warped) clock, or the computed "seconds left" explodes and the
         button never arms. -->
    <h1>Generating your link…</h1>
    <p><span id="t">15</span> seconds remaining</p>
    <div id="msg"></div>
    <button id="next" disabled>Get Link</button>
    <script>
        var start = performance.now();
        var el = document.getElementById('t');
        function frame(ts) {
            var left = 15 - Math.max(0, (ts - start) / 1000);
            if (left <= 0) {
                el.textContent = '0';
                document.getElementById('msg').textContent = 'armed';
                document.getElementById('next').disabled = false;
                return;
            }
            el.textContent = Math.ceil(left);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        document.getElementById('next').addEventListener('click', function () {
            location.href = 'final.html';
        });
    </script>
</body>

</html>
